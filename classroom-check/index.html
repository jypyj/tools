<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수능 교실 점검</title>
<style>
:root {
  --blue: #2563eb;
  --bluedark: #1d4ed8;
  --bluelight: #eff6ff;
  --green: #16a34a;
  --greenlight: #f0fdf4;
  --red: #dc2626;
  --redlight: #fef2f2;
  --gray100: #f1f5f9;
  --gray200: #e2e8f0;
  --gray400: #94a3b8;
  --gray600: #475569;
  --gray800: #1e293b;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Malgun Gothic','맑은 고딕',Apple SD Gothic Neo,sans-serif;
  background: var(--gray100);
  color: var(--gray800);
  line-height: 1.5;
  font-size: 15px;
}
.site-header {
  background: linear-gradient(135deg, #1e3a8a, var(--blue));
  color: #fff;
  padding: 26px 16px 22px;
  text-align: center;
}
.site-header h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -.5px; }
.site-header p { margin-top: 6px; opacity: .85; font-size: .86rem; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
.card {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 16px;
  margin-bottom: 14px;
}
.card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
label.field { display: block; font-size: .82rem; font-weight: 700; color: var(--gray600); margin-bottom: 6px; }
select, textarea {
  width: 100%;
  border: 1.5px solid var(--gray200);
  border-radius: 8px;
  padding: 11px 12px;
  font: inherit;
  background: #fff;
  color: var(--gray800);
}
select:focus, textarea:focus { outline: none; border-color: var(--blue); }
textarea { min-height: 90px; resize: vertical; }

.item { padding: 14px 0; border-bottom: 1px solid var(--gray200); }
.item:last-child { border-bottom: none; padding-bottom: 0; }
.item:first-of-type { padding-top: 0; }
.item-title { font-weight: 700; font-size: .95rem; }
.item-desc { font-size: .78rem; color: var(--gray400); margin: 2px 0 8px; }
select.ok   { border-color: var(--green); background: var(--greenlight); color: var(--green); font-weight: 700; }
select.bad  { border-color: var(--red);   background: var(--redlight);   color: var(--red);   font-weight: 700; }
select.na   { border-color: var(--gray400); background: var(--gray100); color: var(--gray600); font-weight: 700; }

.hint { font-size: .78rem; color: var(--gray400); margin-top: 6px; }
.hint.warn { color: var(--red); font-weight: 700; }

.btn {
  display: block;
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 15px;
  font: inherit;
  font-size: 1rem;
  font-weight: 800;
  background: var(--blue);
  color: #fff;
  cursor: pointer;
}
.btn:active { background: var(--bluedark); }
.btn:disabled { background: var(--gray400); cursor: default; }
.err { display: none; color: var(--red); font-size: .85rem; font-weight: 700; margin-bottom: 10px; text-align: center; }
.err.show { display: block; }

.done { text-align: center; padding: 36px 16px; }
.done .big { font-size: 3rem; }
.done h2 { margin: 8px 0 6px; font-size: 1.2rem; }
.done p { color: var(--gray600); font-size: .9rem; }
.link-btn { background: none; border: none; color: var(--blue); font: inherit; font-size: .85rem; text-decoration: underline; cursor: pointer; margin-top: 14px; }
.footer { text-align: center; padding: 8px 0 24px; }
.footer a { color: var(--gray400); font-size: .78rem; }

/* 선생님 결과 보기 */
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { background: var(--gray100); border-radius: 999px; padding: 5px 12px; font-size: .82rem; font-weight: 700; }
.chip.red { background: var(--redlight); color: var(--red); }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: .78rem; min-width: 760px; }
th, td { border: 1px solid var(--gray200); padding: 6px 5px; text-align: center; vertical-align: middle; }
th { background: var(--bluelight); font-weight: 700; }
td.bad { background: var(--redlight); color: var(--red); font-weight: 700; }
td.na { color: var(--gray400); }
td.memo { text-align: left; min-width: 160px; }
tr.missing td { color: var(--gray400); }
.issue { padding: 10px 0; border-bottom: 1px solid var(--gray200); font-size: .88rem; }
.issue:last-child { border-bottom: none; }
.issue b { color: var(--red); }
.hidden { display: none; }
</style>
</head>
<body>

<header class="site-header">
  <h1>수능 교실 점검</h1>
  <p>내 자리를 확인하고 항목별로 선택해주세요</p>
</header>

<main class="wrap">

  <!-- 학생 입력 -->
  <section id="formView">
    <div class="card">
      <label class="field" for="student">번호 / 이름</label>
      <select id="student">
        <option value="">번호를 선택해주세요</option>
      </select>
    </div>

    <div class="card">
      <h2>점검 항목</h2>
      <div id="items"></div>
    </div>

    <div class="card">
      <label class="field" for="memo">기타 (이외의 내용)</label>
      <textarea id="memo" placeholder="이상이 있으면 자세히 적어주세요. (예: 책상 오른쪽 다리가 흔들림, 창가 쪽 형광등 깜박임)"></textarea>
      <p class="hint" id="memoHint">없으면 비워두어도 됩니다.</p>
    </div>

    <p class="err" id="err"></p>
    <button class="btn" id="btnSubmit">제출하기</button>
    <div class="footer"><a href="#teacher">선생님 결과 보기</a></div>
  </section>

  <!-- 제출 완료 -->
  <section id="doneView" class="hidden">
    <div class="card done">
      <div class="big">✅</div>
      <h2>제출 완료!</h2>
      <p id="doneMsg">점검해줘서 고마워요.</p>
      <button class="link-btn" id="btnAgain">잘못 선택했어요 (다시 제출)</button>
    </div>
  </section>

  <!-- 선생님 결과 보기 -->
  <section id="teacherView" class="hidden">
    <div class="card">
      <h2>조치 필요 항목</h2>
      <div class="summary" id="summary"></div>
      <div id="issues"></div>
    </div>
    <div class="card">
      <h2>전체 현황</h2>
      <div class="table-wrap"><table id="resultTable"></table></div>
      <p class="hint">같은 학생이 다시 제출하면 마지막 제출로 바뀝니다.</p>
    </div>
    <button class="btn" id="btnReload">새로고침</button>
    <div class="footer"><a href="#">학생 입력 화면으로</a></div>
  </section>

</main>

<script>
// Apps Script 웹 앱 주소 (.../exec) — apps-script.gs 상단 설치 방법 참고
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbztFhvPOJnFD0bK4e_vkfHycY21aSWyXi2AJDVg6wpURXn1F-62SMEsoVc7PqEsDrd_8g/exec';

const STUDENTS = [
  [1,'김가윤'],[2,'김민서'],[3,'김서연'],[4,'김서영'],[5,'김서진'],[6,'김서현'],
  [7,'김시은'],[8,'김예음'],[10,'김유은'],[11,'김은빈'],[12,'김지우'],[13,'김하영'],
  [14,'박서빈'],[15,'박수연'],[16,'박시연'],[17,'박연수'],[18,'박은서'],[19,'박효민'],
  [20,'신정은'],[21,'오선후'],[22,'이소이'],[23,'이예진'],[24,'이의진'],[25,'임유안'],
  [26,'정영해'],[27,'정하연'],[28,'형채원']
];

// na: '해당 없음' 선택지 포함 여부
const ITEMS = [
  { key: 'desk',   title: '책상 상태',            desc: '고장, 삐걱거림, 낙서, 수평 등' },
  { key: 'chair',  title: '의자 상태',            desc: '고장, 삐걱거림, 수평 등' },
  { key: 'inside', title: '책상 속 비우기',        desc: '책상 서랍 안이 비어 있는지' },
  { key: 'locker', title: '사물함 비우고 열어놓기', desc: '사물함을 비우고 문을 열어두었는지' },
  { key: 'window', title: '창문 잠금장치 개폐 확인', desc: '잠금장치가 잘 열리고 잠기는지', na: true },
  { key: 'blind',  title: '블라인드',              desc: '파손 여부, 위아래 조절 가능 여부 등', na: true },
  { key: 'light',  title: '조명 (형광등 상태)',     desc: '깜박거리거나 어두운 경우 등' }
];

const CLS = { '양호': 'ok', '조치필요': 'bad', '해당 없음': 'na' };

const $ = id => document.getElementById(id);

/* ── 학생 입력 화면 ───────────────────────────── */

STUDENTS.forEach(([n, name]) => {
  $('student').insertAdjacentHTML('beforeend', `<option value="${n}">${n}번 ${name}</option>`);
});

ITEMS.forEach(it => {
  const opts = ['양호', '조치필요'].concat(it.na ? ['해당 없음'] : []);
  $('items').insertAdjacentHTML('beforeend', `
    <div class="item">
      <div class="item-title">${it.title}</div>
      <div class="item-desc">${it.desc}</div>
      <select id="sel_${it.key}" class="check">
        <option value="">선택해주세요</option>
        ${opts.map(o => `<option value="${o}">${o}</option>`).join('')}
      </select>
    </div>`);
});

document.querySelectorAll('select.check').forEach(sel => {
  sel.addEventListener('change', () => {
    sel.className = 'check ' + (CLS[sel.value] || '');
    updateMemoHint();
  });
});

function updateMemoHint() {
  const anyBad = ITEMS.some(it => $('sel_' + it.key).value === '조치필요');
  $('memoHint').textContent = anyBad
    ? '조치필요를 선택한 항목이 있어요. 어떤 문제인지 적어주면 빨리 고칠 수 있어요.'
    : '없으면 비워두어도 됩니다.';
  $('memoHint').classList.toggle('warn', anyBad);
}

function showError(msg) {
  $('err').textContent = msg;
  $('err').classList.add('show');
}

$('btnSubmit').addEventListener('click', async () => {
  $('err').classList.remove('show');

  const num = $('student').value;
  if (!num) return showError('번호를 선택해주세요.');

  const missing = ITEMS.filter(it => !$('sel_' + it.key).value);
  if (missing.length) return showError(`선택하지 않은 항목이 있어요: ${missing.map(m => m.title).join(', ')}`);

  if (SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') return showError('아직 제출 주소가 설정되지 않았습니다. 선생님께 알려주세요.');

  const name = STUDENTS.find(s => String(s[0]) === num)[1];
  const data = { number: Number(num), name, memo: $('memo').value.trim() };
  ITEMS.forEach(it => { data[it.key] = $('sel_' + it.key).value; });

  const btn = $('btnSubmit');
  btn.disabled = true;
  btn.textContent = '제출 중...';
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(data)
    });
    $('doneMsg').textContent = `${num}번 ${name}, 점검해줘서 고마워요.`;
    $('formView').classList.add('hidden');
    $('doneView').classList.remove('hidden');
    window.scrollTo(0, 0);
  } catch (e) {
    showError('제출에 실패했어요. 인터넷 연결을 확인하고 다시 눌러주세요.');
  } finally {
    btn.disabled = false;
    btn.textContent = '제출하기';
  }
});

$('btnAgain').addEventListener('click', () => {
  $('doneView').classList.add('hidden');
  $('formView').classList.remove('hidden');
});

/* ── 선생님 결과 보기 (#teacher) ───────────────── */

async function loadResults() {
  $('summary').innerHTML = '<span class="chip">불러오는 중...</span>';
  $('issues').innerHTML = '';
  $('resultTable').innerHTML = '';
  if (SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
    $('summary').innerHTML = '<span class="chip red">SCRIPT_URL이 설정되지 않았습니다.</span>';
    return;
  }
  let rows;
  try {
    const res = await fetch(SCRIPT_URL + '?action=list');
    rows = (await res.json()).rows || [];
  } catch (e) {
    $('summary').innerHTML = '<span class="chip red">결과를 불러오지 못했습니다.</span>';
    return;
  }

  const byNum = {};
  rows.forEach(r => { byNum[r.number] = r; });

  const issues = [];
  STUDENTS.forEach(([n, name]) => {
    const r = byNum[n];
    if (!r) return;
    const bad = ITEMS.filter(it => r[it.key] === '조치필요').map(it => it.title);
    if (bad.length || r.memo) issues.push({ n, name, bad, memo: r.memo });
  });

  const submitted = STUDENTS.filter(([n]) => byNum[n]).length;
  const badCount = issues.filter(i => i.bad.length).length;
  $('summary').innerHTML = `
    <span class="chip">제출 ${submitted} / ${STUDENTS.length}</span>
    <span class="chip red">조치필요 ${badCount}명</span>`;

  $('issues').innerHTML = issues.length
    ? issues.map(i => `<div class="issue">${i.n}번 ${esc(i.name)} — ${i.bad.length ? '<b>' + i.bad.join(', ') + '</b>' : '(기타만 작성)'}${i.memo ? '<br>📝 ' + esc(i.memo) : ''}</div>`).join('')
    : '<p class="hint">조치가 필요한 항목이 없습니다.</p>';

  const head = '<tr><th>번호</th><th>이름</th>' + ITEMS.map(it => `<th>${it.title}</th>`).join('') + '<th>기타</th><th>제출시각</th></tr>';
  const body = STUDENTS.map(([n, name]) => {
    const r = byNum[n];
    if (!r) return `<tr class="missing"><td>${n}</td><td>${name}</td>${ITEMS.map(() => '<td>-</td>').join('')}<td class="memo">미제출</td><td></td></tr>`;
    return `<tr><td>${n}</td><td>${name}</td>` +
      ITEMS.map(it => `<td class="${CLS[r[it.key]] || ''}">${esc(r[it.key] || '')}</td>`).join('') +
      `<td class="memo">${esc(r.memo || '')}</td><td>${esc(r.timestamp || '')}</td></tr>`;
  }).join('');
  $('resultTable').innerHTML = head + body;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

$('btnReload').addEventListener('click', loadResults);

function route() {
  const teacher = location.hash === '#teacher';
  $('teacherView').classList.toggle('hidden', !teacher);
  $('formView').classList.toggle('hidden', teacher);
  $('doneView').classList.add('hidden');
  if (teacher) loadResults();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
