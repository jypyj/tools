<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #2563eb;
  --bluedark: #1d4ed8;
  --bluelight: #eff6ff;
  --violet: #7c3aed;
  --violetlight: #f5f3ff;
  --green: #16a34a;
  --red: #dc2626;
  --gray50: #f8fafc;
  --gray100: #f1f5f9;
  --gray200: #e2e8f0;
  --gray300: #cbd5e1;
  --gray400: #94a3b8;
  --gray600: #475569;
  --gray800: #1e293b;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
}

html, body { height: 100%; }
body {
  font-family: 'Malgun Gothic','맑은 고딕',Apple SD Gothic Neo,sans-serif;
  background: var(--gray100);
  color: var(--gray800);
  line-height: 1.6;
  font-size: 15px;
  display: flex;
  flex-direction: column;
}

header {
  background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
  color: #fff;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
header h1 { font-size: 1.05rem; font-weight: 800; letter-spacing: -.3px; }
header .who {
  margin-left: auto;
  font-size: .78rem;
  opacity: .85;
  background: rgba(255,255,255,.15);
  padding: 5px 12px;
  border-radius: 99px;
}

.wrap {
  flex: 1;
  display: flex;
  gap: 14px;
  padding: 14px;
  min-height: 0;
}

.pane {
  background: #fff;
  border-radius: 12px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.pane-essay { flex: 1; min-width: 0; }
.pane-chat { flex: 1; min-width: 0; }

.pane-head {
  padding: 13px 16px;
  border-bottom: 1.5px solid var(--gray200);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.pane-head h2 { font-size: .9rem; font-weight: 700; color: #1e3a8a; }
.pane-chat .pane-head h2 { color: #6d28d9; }
.pane-head .count {
  margin-left: auto;
  font-size: .76rem;
  color: var(--gray400);
  font-weight: 700;
}

#essay {
  flex: 1;
  border: none;
  resize: none;
  padding: 16px;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: .97rem;
  line-height: 1.85;
  color: #0f172a;
  outline: none;
  min-height: 0;
}
#essay::placeholder { color: var(--gray400); font-family: 'Malgun Gothic', sans-serif; }

.pane-foot {
  padding: 12px 16px;
  border-top: 1.5px solid var(--gray200);
  flex-shrink: 0;
}

.btn {
  border: none;
  border-radius: 9px;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: filter .15s, opacity .15s;
}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-analyze {
  width: 100%;
  background: var(--blue);
  color: #fff;
  padding: 12px;
  font-size: .95rem;
}

/* ── 채팅 ── */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

.msg { display: flex; }
.msg.me { justify-content: flex-end; }

.bubble {
  max-width: 88%;
  padding: 11px 14px;
  border-radius: 14px;
  font-size: .9rem;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.me .bubble {
  background: var(--blue);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.ai .bubble {
  background: var(--violetlight);
  border: 1.5px solid #ddd6fe;
  color: #2e1065;
  border-bottom-left-radius: 4px;
}
.bubble b { font-weight: 800; }
.bubble code {
  background: rgba(0,0,0,.06);
  padding: 1px 5px;
  border-radius: 4px;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-style: italic;
}

.empty {
  margin: auto;
  text-align: center;
  color: var(--gray400);
  font-size: .86rem;
  line-height: 1.9;
  padding: 20px;
}
.empty .big { font-size: 2rem; display: block; margin-bottom: 8px; }

.typing {
  display: flex;
  gap: 4px;
  padding: 13px 16px;
  background: var(--violetlight);
  border: 1.5px solid #ddd6fe;
  border-radius: 14px;
  border-bottom-left-radius: 4px;
  width: fit-content;
}
.typing span {
  width: 7px; height: 7px;
  background: #a78bfa;
  border-radius: 50%;
  animation: bounce 1.3s infinite;
}
.typing span:nth-child(2) { animation-delay: .18s; }
.typing span:nth-child(3) { animation-delay: .36s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .5; }
  30% { transform: translateY(-5px); opacity: 1; }
}

.composer {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1.5px solid var(--gray200);
  flex-shrink: 0;
}
#msg {
  flex: 1;
  border: 1.5px solid var(--gray200);
  border-radius: 9px;
  padding: 10px 12px;
  font-family: inherit;
  font-size: .9rem;
  resize: none;
  outline: none;
  max-height: 110px;
  line-height: 1.5;
}
#msg:focus { border-color: var(--violet); }
.btn-send {
  background: var(--violet);
  color: #fff;
  padding: 0 18px;
  font-size: .9rem;
  flex-shrink: 0;
}

.err {
  background: #fef2f2;
  border: 1.5px solid #fecaca;
  color: #b91c1c;
  padding: 10px 13px;
  border-radius: 9px;
  font-size: .84rem;
  margin: 0 16px 12px;
}

.tip {
  font-size: .76rem;
  color: var(--gray400);
  text-align: center;
  padding: 8px 14px 12px;
  line-height: 1.6;
  flex-shrink: 0;
}

@media (max-width: 820px) {
  body { height: auto; }
  .wrap { flex-direction: column; padding: 10px; }
  .pane-essay { min-height: 300px; }
  .pane-chat { min-height: 460px; }
  header .who { display: none; }
}
</style>
</head>
<body data-assignment="<?= assignment ?>">

<header>
  <h1>✍️ 영어 글쓰기 피드백 챗봇</h1>
  <span style="font-size:.8rem;opacity:.8;">과제: <?= assignment ?></span>
  <span class="who" id="who">확인 중…</span>
</header>

<div class="wrap">

  <!-- 왼쪽: 학생 글 -->
  <section class="pane pane-essay">
    <div class="pane-head">
      <h2>📄 내가 쓴 글</h2>
      <span class="count" id="wc">0 단어</span>
    </div>
    <textarea id="essay" spellcheck="false" placeholder="구글 문서에 쓴 글을 여기에 붙여넣으세요.

고치면서 여기 내용도 같이 바꾸면, 챗봇이 항상 최신 글을 보고 피드백합니다."></textarea>
    <div class="pane-foot">
      <button class="btn btn-analyze" id="btnAnalyze">🔍 내 글 분석받기</button>
    </div>
  </section>

  <!-- 오른쪽: 챗봇 -->
  <section class="pane pane-chat">
    <div class="pane-head">
      <h2>💬 글쓰기 코치</h2>
    </div>

    <div id="chat">
      <div class="empty" id="empty">
        <span class="big">👋</span>
        왼쪽에 글을 붙여넣고<br><b>「내 글 분석받기」</b>를 눌러 보세요.<br><br>
        코치는 <b>대신 고쳐주지 않습니다.</b><br>
        어디가 왜 문제인지 알려주면<br>스스로 고쳐 보세요.
      </div>
    </div>

    <div id="errBox"></div>

    <div class="composer">
      <textarea id="msg" rows="1" placeholder="궁금한 걸 물어보세요. (Enter 전송 / Shift+Enter 줄바꿈)"></textarea>
      <button class="btn btn-send" id="btnSend">전송</button>
    </div>
    <p class="tip">이 대화는 선생님께 기록으로 남습니다.</p>
  </section>

</div>

<script>
// 주의: Apps Script 스크립틀릿을 이 <script> 블록 안에서 직접 쓰면 안 됩니다.
// 출력이 HTML 이스케이프되어 큰따옴표가 &quot; 로 바뀌고 JS 문법 오류가 납니다.
// (주석 안에 써도 템플릿 엔진이 해석하므로 위험합니다.)
// 값은 body의 data 속성으로 넘겨 읽습니다.
const ASSIGNMENT = document.body.dataset.assignment || '';

/* ── 이 파일을 더블클릭해서 연 경우를 막는다 ──────────────────────
   google.script.run 은 Apps Script가 서빙하는 페이지에서만 존재합니다.
   로컬 파일(file://)로 열면 없어서 스크립트가 통째로 죽습니다.
   그러면 "확인 중…"에서 멈추고 버튼이 안 먹는데, 원인을 알기 어려우므로
   여기서 미리 잡아 이유를 화면에 띄웁니다.                          */
if (typeof google === 'undefined' || !google.script) {
  document.body.innerHTML =
    '<div style="max-width:560px;margin:14vh auto;padding:32px;background:#fff;' +
    'border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.1);text-align:center;' +
    'font-family:Malgun Gothic,sans-serif;line-height:1.75;">' +
      '<div style="font-size:2.6rem;margin-bottom:10px;">🚫</div>' +
      '<h1 style="font-size:1.15rem;color:#b91c1c;margin-bottom:14px;">' +
        '이 파일은 더블클릭해서 열면 안 됩니다</h1>' +
      '<p style="font-size:.93rem;color:#475569;margin-bottom:18px;">' +
        '이 <b>index.html</b>은 <b>Apps Script 프로젝트에 붙여넣는 재료</b>입니다.<br>' +
        '파일로 직접 열면 작동하지 않습니다.</p>' +
      '<div style="text-align:left;background:#f8fafc;border:1.5px solid #e2e8f0;' +
      'border-radius:10px;padding:16px 18px;font-size:.88rem;color:#1e293b;">' +
        '<b>올바른 사용법</b><br>' +
        '1. 이 파일 내용을 Apps Script의 <code>index</code> HTML 파일에 붙여넣기<br>' +
        '2. <b>배포 → 웹 앱</b> (액세스: 학교 도메인 내)<br>' +
        '3. <b><code>/exec</code> 로 끝나는 웹 앱 주소</b>로 접속<br>' +
        '<span style="color:#64748b;">→ 학생에게는 그 주소를 Classroom 링크로 줍니다.</span>' +
      '</div>' +
      '<p style="margin-top:16px;font-size:.8rem;color:#94a3b8;">' +
        '자세한 내용은 같은 폴더의 README.md 참고</p>' +
    '</div>';
  throw new Error('LOCAL_FILE_OPEN');   // 아래 코드가 실행되지 않도록 중단
}

const $ = function (id) { return document.getElementById(id); };
const essayEl = $('essay');
const chatEl  = $('chat');
const msgEl   = $('msg');

let history = [];     // [{role:'user'|'model', text}]
let busy = false;

/* 학생 이름 표시 */
google.script.run.withSuccessHandler(function (s) {
  $('who').textContent = s.email ? s.name : '이름 확인 안 됨';
}).getStudent();

/* 단어 수 */
essayEl.addEventListener('input', updateCount);
function updateCount() {
  const n = essayEl.value.trim().split(/\s+/).filter(Boolean).length;
  $('wc').textContent = n.toLocaleString() + ' 단어';
}

/* 입력창 높이 자동 조절 */
msgEl.addEventListener('input', function () {
  msgEl.style.height = 'auto';
  msgEl.style.height = Math.min(110, msgEl.scrollHeight) + 'px';
});

msgEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

$('btnAnalyze').addEventListener('click', function () { ask('analyze', ''); });
$('btnSend').addEventListener('click', send);

function send() {
  const text = msgEl.value.trim();
  if (!text) return;
  msgEl.value = '';
  msgEl.style.height = 'auto';
  ask('chat', text);
}

function ask(mode, text) {
  if (busy) return;

  const essay = essayEl.value.trim();
  if (!essay) {
    showErr('먼저 왼쪽에 글을 붙여넣어 주세요.');
    essayEl.focus();
    return;
  }

  clearErr();
  const empty = $('empty');
  if (empty) empty.remove();

  if (mode === 'analyze') {
    addBubble('me', '제 글을 분석해 주세요.');
  } else {
    addBubble('me', text);
  }

  busy = true;
  setDisabled(true);
  const typing = addTyping();

  google.script.run
    .withSuccessHandler(function (res) {
      typing.remove();
      busy = false;
      setDisabled(false);

      if (!res.success) {
        showErr(res.message);
        return;
      }

      addBubble('ai', res.reply);

      // 대화 맥락 유지 (글 본문은 서버가 매번 최신본으로 붙여줍니다)
      history.push({ role: 'user',  text: mode === 'analyze' ? '제 글을 분석해 주세요.' : text });
      history.push({ role: 'model', text: res.reply });

      msgEl.focus();
    })
    .withFailureHandler(function (err) {
      typing.remove();
      busy = false;
      setDisabled(false);
      showErr('연결 오류: ' + (err && err.message ? err.message : err));
    })
    .askCoach({
      essay: essay,
      message: text,
      history: history,
      mode: mode,
      assignment: ASSIGNMENT
    });
}

function setDisabled(v) {
  $('btnAnalyze').disabled = v;
  $('btnSend').disabled = v;
}

function addBubble(who, text) {
  const row = document.createElement('div');
  row.className = 'msg ' + (who === 'me' ? 'me' : 'ai');

  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = format(text);

  row.appendChild(b);
  chatEl.appendChild(row);
  scrollDown();
  return row;
}

function addTyping() {
  const row = document.createElement('div');
  row.className = 'msg ai';
  row.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chatEl.appendChild(row);
  scrollDown();
  return row;
}

function scrollDown() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

/* **굵게** 와 "인용" 정도만 살리고 나머지는 그대로 (XSS 방지 위해 먼저 이스케이프) */
function format(s) {
  return String(s)
    .replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    })
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

function showErr(m) {
  $('errBox').innerHTML = '<div class="err">' + format(m) + '</div>';
}
function clearErr() {
  $('errBox').innerHTML = '';
}
</script>
</body>
</html>
